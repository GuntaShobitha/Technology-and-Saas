<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <rect width="600" height="400" rx="12" fill="#111419"/>
  <!-- Subtle Grid lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="bronzeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CCA072"/>
      <stop offset="100%" stop-color="#B8824F"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- Connecting Lines -->
  <path d="M 120 200 L 240 120 L 360 120 L 480 200" stroke="#CCA072" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <path d="M 120 200 L 240 280 L 360 280 L 480 200" stroke="#CCA072" stroke-width="2" opacity="0.6"/>
  <path d="M 240 120 L 240 280" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <path d="M 360 120 L 360 280" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Center Core -->
  <circle cx="300" cy="200" r="48" fill="#1A1F27" stroke="url(#bronzeGrad)" stroke-width="2"/>
  <circle cx="300" cy="200" r="38" fill="#13171D"/>
  <text x="300" y="196" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#CCA072" text-anchor="middle">STACKLY</text>
  <text x="300" y="212" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#98A2B3" text-anchor="middle">KERNEL</text>

  <!-- Node 1: Ingestion API -->
  <rect x="70" y="172" width="100" height="56" rx="6" fill="#151921" stroke="rgba(255,255,255,0.1)"/>
  <text x="120" y="196" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#FAF8F5" text-anchor="middle">GATEWAY</text>
  <text x="120" y="212" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#8C95A8" text-anchor="middle">REST / gRPC</text>

  <!-- Node 2: Neural Inference -->
  <rect x="190" y="92" width="100" height="56" rx="6" fill="#151921" stroke="rgba(204,160,114,0.3)"/>
  <text x="240" y="116" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#FAF8F5" text-anchor="middle">AI ENGINE</text>
  <text x="240" y="132" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#CCA072" text-anchor="middle">Inference</text>

  <!-- Node 3: Cloud Pipeline -->
  <rect x="310" y="92" width="100" height="56" rx="6" fill="#151921" stroke="rgba(255,255,255,0.1)"/>
  <text x="360" y="116" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#FAF8F5" text-anchor="middle">DATA MESH</text>
  <text x="360" y="132" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#8C95A8" text-anchor="middle">Stream Sync</text>

  <!-- Node 4: Security Shield -->
  <rect x="190" y="252" width="100" height="56" rx="6" fill="#151921" stroke="rgba(255,255,255,0.1)"/>
  <text x="240" y="276" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#FAF8F5" text-anchor="middle">ZERO-TRUST</text>
  <text x="240" y="292" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#4ADE80" text-anchor="middle">TLS 1.3 / mTLS</text>

  <!-- Node 5: Real-time DB -->
  <rect x="310" y="252" width="100" height="56" rx="6" fill="#151921" stroke="rgba(255,255,255,0.1)"/>
  <text x="360" y="276" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#FAF8F5" text-anchor="middle">DIST. STORE</text>
  <text x="360" y="292" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#8C95A8" text-anchor="middle">Multi-Region</text>

  <!-- Node 6: Edge Output -->
  <rect x="430" y="172" width="100" height="56" rx="6" fill="#151921" stroke="rgba(255,255,255,0.1)"/>
  <text x="480" y="196" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#FAF8F5" text-anchor="middle">EDGE CDN</text>
  <text x="480" y="212" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#8C95A8" text-anchor="middle">&lt; 14ms Global</text>
</svg>
